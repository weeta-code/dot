# Dotfiles mise configuration
# Run `mise run setup` on any new machine after cloning

[env]
EDITOR = "nvim"
DOTFILES = "~/.config"

[tools]
# Languages - all latest stable (invariants: go, python, c/c++, lua)
node = "latest"
python = "latest"
go = "latest"
rust = "latest"
lua = "latest"

# CLI tools
ripgrep = "latest"
fd = "latest"
fzf = "latest"
lazygit = "latest"
neovim = "latest"
tmux = "latest"
ffmpeg = "latest"
jq = "latest"

# LSP servers (mise-installable)
"npm:typescript-language-server" = "latest"
"npm:pyright" = "latest"
"go:golang.org/x/tools/gopls" = "latest"
lua-language-server = "latest"

[tasks.setup]
description = "Full dotfiles setup for workstations (macOS/Linux desktop)"
depends = ["xcode", "omz", "link", "tools", "brew", "services"]
run = "echo '✓ Dotfiles setup complete!'"

[tasks.omz]
description = "Install Oh My Zsh and Powerlevel10k"
run = """
#!/bin/bash
if [[ ! -d "$HOME/.oh-my-zsh" ]]; then
    echo "Installing Oh My Zsh..."
    RUNZSH=no CHSH=no sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)"
else
    echo "✓ Oh My Zsh already installed"
fi

P10K_DIR="${ZSH_CUSTOM:-$HOME/.oh-my-zsh/custom}/themes/powerlevel10k"
if [[ ! -d "$P10K_DIR" ]]; then
    echo "Installing Powerlevel10k..."
    git clone --depth=1 https://github.com/romkatv/powerlevel10k.git "$P10K_DIR"
else
    echo "✓ Powerlevel10k already installed"
fi
"""

[tasks.xcode]
description = "Install Xcode Command Line Tools (macOS only)"
run = """
#!/bin/bash
if [[ "$OSTYPE" == "darwin"* ]]; then
    if ! xcode-select -p &>/dev/null; then
        echo "Installing Xcode Command Line Tools..."
        xcode-select --install
        echo "⚠️  Please complete the installation dialog, then re-run setup"
        exit 1
    else
        echo "✓ Xcode CLI tools already installed"
    fi
else
    echo "Skipping (not macOS)"
fi
"""

[tasks."setup:server"]
description = "Minimal setup for servers/homelab (no GUI tools)"
depends = ["link", "tools:core"]
run = "echo '✓ Server setup complete!'"

[tasks.link]
description = "Create symlinks for home directory dotfiles"
run = """
#!/bin/bash
set -e
DOTFILES="$HOME/.config"

# Home directory dotfiles
ln -sf "$DOTFILES/home/.zshrc" "$HOME/.zshrc"
ln -sf "$DOTFILES/home/.tmux.conf" "$HOME/.tmux.conf"
ln -sf "$DOTFILES/home/.gitconfig" "$HOME/.gitconfig"

# Oh My Zsh custom theme
if [[ -d "$HOME/.oh-my-zsh/custom/themes" ]]; then
    ln -sf "$DOTFILES/zsh/themes/inrainbows.zsh-theme" "$HOME/.oh-my-zsh/custom/themes/inrainbows.zsh-theme"
fi

# Powerlevel10k config
ln -sf "$DOTFILES/zsh/p10k.zsh" "$HOME/.p10k.zsh"

echo "✓ Dotfiles linked"
"""

[tasks.tools]
description = "Install all mise-managed tools"
run = "mise install"

[tasks."tools:core"]
description = "Install only core CLI tools (no GUI)"
run = "mise install node python go ripgrep fd fzf neovim tmux"

[tasks.update]
description = "Pull latest dotfiles and update tools"
run = """
#!/bin/bash
set -e
cd ~/.config
git pull
mise install
echo "✓ Dotfiles updated"
"""

[tasks.brew]
description = "Install Homebrew packages (macOS only)"
run = """
#!/bin/bash
if [[ "$OSTYPE" == "darwin"* ]] && command -v brew &>/dev/null; then
    brew bundle --file="$HOME/.config/Brewfile" 2>/dev/null || echo "No Brewfile found"
else
    echo "Skipping brew (not macOS or brew not installed)"
fi
"""

[tasks.upgrade]
description = "Upgrade all tools to latest versions"
run = "mise upgrade"

[tasks.services]
description = "Start macOS services (sketchybar, borders)"
run = """
#!/bin/bash
if [[ "$OSTYPE" == "darwin"* ]]; then
    brew services start sketchybar 2>/dev/null || true
    brew services start borders 2>/dev/null || true
    echo "✓ Services started"
fi
"""
